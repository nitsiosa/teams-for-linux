<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login Dialog</title>
    <link rel="stylesheet" href="../_shared/pearlLuxe/tokens.css">
  <link rel="stylesheet" href="../_shared/pearlLuxe/components.css">
  <link rel="stylesheet" href="../_shared/pearlLuxe/surfaces.css">
</head>

  <body class="tfl-pl tfl-pl-login">
    <form name="form" onSubmit="JavaScript:sendForm(event)">
      <input
        type="email"
        name="username"
        id="username"
        aria-label="Username"
        value=""
        placeholder="email of/or domain\username"
        autofocus
      />
      <br /><br />
      <input
        type="password"
        name="password"
        id="password"
        aria-label="Password"
        value=""
        placeholder="Password"
      />
      <br /><br />
      <input
        type="submit"
        class="primary"
        value="Submit"
      />
    </form>

    <script>
      function sendForm(event) {
        event.preventDefault();
        globalThis.api.submitForm({
          username: document.getElementById("username").value,
          password: document.getElementById("password").value,
        });
      }
    </script>
  </body>
</html>
